<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <!-- Tu hoja de estilos original recuperada -->
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Contenedor principal de administración -->
  <div class="admin-container">
    <header class="admin-header">
      <h1>Panel de Administración</h1>
      <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
    </header>

    <!-- Sección de Bloqueo de Días -->
    <section class="admin-section">
      <h2>Bloquear Días del Calendario</h2>
      <form id="blockDayForm" class="block-day-form">
        <div class="form-group">
          <label for="blockDate">Fecha:</label>
          <input type="date" id="blockDate" required>
        </div>
        <div class="form-group flex-grow">
          <label for="blockReason">Motivo:</label>
          <input type="text" id="blockReason" placeholder="Ej. Mantenimiento general" required>
        </div>
        <button type="submit" class="btn btn-primary">Bloquear Día</button>
      </form>
      
      <h3>Días actualmente bloqueados</h3>
      <ul id="blockedDaysList" class="blocked-days-list">
        <!-- Se llena dinámicamente -->
      </ul>
    </section>

    <!-- Sección de Reportes -->
    <section class="admin-section">
      <h2>Informes Mensuales</h2>
      <div class="reports-controls">
        <div class="form-group">
          <label for="month-select">Período:</label>
          <input type="month" id="month-select">
        </div>
        <button id="btn-download-pdf" class="btn btn-info">Descargar PDF del Mes</button>
      </div>

      <h3>Historial de Envíos</h3>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Período</th>
              <th>Fecha de Envío</th>
              <th>Destinatario</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Sección de Gestión de Unidades -->
    <section class="admin-section">
      <div class="section-header-actions">
        <h2>Gestión de Unidades</h2>
        <div class="action-buttons">
          <button id="btn-open-add-modal" class="btn btn-success">+ Nueva Unidad</button>
          <button id="btn-delete-selected" class="btn btn-danger">Eliminar Seleccionadas</button>
          <button id="btn-delete-all" class="btn btn-danger-dark">Eliminar Todas</button>
        </div>
      </div>

      <!-- Importación por Excel -->
      <div class="excel-import-box">
        <input type="file" id="excel-file-input" accept=".xlsx, .xls">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-replace-all"> Reemplazar base actual
        </label>
        <button id="btn-upload-excel" class="btn btn-primary">Importar Excel</button>
      </div>

      <!-- Tabla de Unidades -->
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th class="col-checkbox"><input type="checkbox" id="select-all-units"></th>
              <th>Unidad</th>
              <th>Piso/Dto</th>
              <th>Propietario</th>
              <th>Email</th>
              <th class="text-center">PIN</th>
              <th>Acción PIN</th>
              <th class="text-center">Baja</th>
            </tr>
          </thead>
          <tbody id="units-tbody">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Modal para Agregar Unidad -->
  <div id="add-unit-modal" class="modal">
    <div class="modal-content">
      <h3>Agregar Nueva Unidad</h3>
      <form id="add-unit-form">
        <div class="form-group">
          <label>Unidad / Identificador:</label>
          <input type="text" id="input-unidad" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Piso:</label>
            <input type="text" id="input-piso">
          </div>
          <div class="form-group">
            <label>Departamento:</label>
            <input type="text" id="input-dto">
          </div>
        </div>
        <div class="form-group">
          <label>Propietario:</label>
          <input type="text" id="input-propietario" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico:</label>
          <input type="email" id="input-email">
        </div>
        <div class="form-group">
          <label>PIN (4 dígitos):</label>
          <input type="text" id="input-pin" maxlength="4" placeholder="Dejar en blanco para autogenerar" class="font-mono">
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-close-modal" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Unidad</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONTENEDOR PARA LAS NOTIFICACIONES FLOTANTES (TOASTS) -->
  <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

  <!-- Script de administración -->
  <script src="/js/admin.js"></script>

  <!-- Script menor para manejar la visibilidad del modal -->
  <script>
    const modalEl = document.getElementById('add-unit-modal');
    if (modalEl) {
      const observer = new MutationObserver(() => {
        if (modalEl.classList.contains('active')) {
          modalEl.style.display = 'flex';
        } else {
          modalEl.style.display = 'none';
        }
      });
      observer.observe(modalEl, { attributes: true, attributeFilter: ['class'] });
    }
  </script>
</body>
</html>
